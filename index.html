<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SigEp Chapter School Logos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --purple: #4b1e6b;
    --purple-dark: #33144a;
    --gray-bg: #f5f5f7;
    --border: #d9d9e0;
    --text: #232228;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: var(--gray-bg);
    color: var(--text);
  }
  header {
    background: var(--purple);
    color: white;
    padding: 20px 28px;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; opacity: 0.85; font-size: 14px; }

  .toolbar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .toolbar input[type="text"] {
    flex: 1 1 260px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .toolbar select, .toolbar button {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: white;
  }
  .toolbar button.primary {
    background: var(--purple);
    color: white;
    border-color: var(--purple);
    cursor: pointer;
    font-weight: 600;
  }
  .toolbar button.primary:disabled {
    background: #b6a6c4;
    border-color: #b6a6c4;
    cursor: not-allowed;
  }
  .toolbar button.secondary {
    cursor: pointer;
  }
  .count-pill {
    font-size: 13px;
    color: #555;
    white-space: nowrap;
  }

  main { padding: 20px 28px 60px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  .card.selected {
    border-color: var(--purple);
    box-shadow: 0 0 0 2px rgba(75,30,107,0.2);
  }
  .card .thumb {
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    border-radius: 6px;
    overflow: hidden;
  }
  .card .thumb img {
    max-width: 100%;
    max-height: 100%;
  }
  .card .thumb.missing {
    color: #999;
    font-size: 12px;
    text-align: center;
    padding: 8px;
  }
  .card .chapter { font-weight: 700; font-size: 13px; color: var(--purple-dark); }
  .card .school { font-size: 13px; line-height: 1.3; }
  .card .meta { font-size: 11px; color: #777; line-height: 1.4; }
  .card label {
    position: absolute;
    top: 10px;
    right: 10px;
  }
  .card input[type="checkbox"] { width: 18px; height: 18px; }

  .empty-state {
    text-align: center;
    color: #777;
    padding: 60px 20px;
  }

  dialog {
    border: none;
    border-radius: 12px;
    padding: 0;
    max-width: 420px;
    width: 90%;
  }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  .dialog-inner { padding: 22px 24px; }
  .dialog-inner h2 { margin-top: 0; font-size: 17px; }
  .dialog-inner label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .dialog-inner select, .dialog-inner input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .dialog-inner .preview {
    margin-top: 8px;
    font-size: 12px;
    color: #666;
    background: #f5f5f7;
    padding: 8px 10px;
    border-radius: 6px;
    word-break: break-all;
  }
  .dialog-actions {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .dialog-actions button {
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: white;
  }
  .dialog-actions button.primary {
    background: var(--purple);
    color: white;
    border-color: var(--purple);
  }
  .status-banner {
    font-size: 12px;
    color: #a15c00;
    background: #fff6e5;
    border: 1px solid #f0d999;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>SigEp Chapter School Logos</h1>
  <p>Search by school, chapter designation, city/state, or federal school code. Select one or more, then download.</p>
</header>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search school name, chapter, alias, city, state, or federal ID...">
  <select id="versionFilter">
    <option value="any">Any logo version</option>
    <option value="white">Has White BG logo</option>
    <option value="transparent">Has Transparent logo</option>
  </select>
  <button class="secondary" id="selectAllBtn">Select all filtered</button>
  <button class="secondary" id="clearBtn">Clear selection</button>
  <span class="count-pill" id="countPill">0 shown &middot; 0 selected</span>
  <button class="primary" id="downloadBtn" disabled>Download selected</button>
</div>

<main>
  <div class="status-banner" id="statusBanner"></div>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No schools match your search.</div>
</main>

<dialog id="downloadDialog">
  <div class="dialog-inner">
    <h2 id="dialogTitle">Download logo</h2>

    <label for="logoVersionSelect">Logo version</label>
    <select id="logoVersionSelect">
      <option value="white">White Background</option>
      <option value="transparent">Transparent</option>
    </select>

    <label for="namingSelect">File naming convention</label>
    <select id="namingSelect">
      <option value="chapter">Chapter designation (e.g. "Ohio Gamma.png")</option>
      <option value="school">Official school name (e.g. "The Ohio State University.png")</option>
      <option value="alias">Short alias (e.g. "Ohio State.png")</option>
      <option value="chapter_school">Chapter + school name</option>
      <option value="federal_id">Federal school code</option>
      <option value="original">Keep original filename</option>
    </select>

    <div class="preview" id="namePreview"></div>

    <div class="dialog-actions">
      <button id="cancelDownloadBtn">Cancel</button>
      <button class="primary" id="confirmDownloadBtn">Download</button>
    </div>
  </div>
</dialog>

<script>
let DATA = [];
let selected = new Set(); // set of chapter strings (unique key)

const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const versionFilter = document.getElementById('versionFilter');
const countPill = document.getElementById('countPill');
const downloadBtn = document.getElementById('downloadBtn');
const emptyState = document.getElementById('emptyState');
const statusBanner = document.getElementById('statusBanner');

fetch('data/master.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    const missingCount = DATA.filter(d => !d.logo_white && !d.logo_transparent).length;
    if (missingCount > 0) {
      statusBanner.style.display = 'block';
      statusBanner.textContent = `${missingCount} chapters have no logo file yet and won't appear below until added.`;
    }
    render();
  })
  .catch(err => {
    grid.innerHTML = '<div class="empty-state">Could not load data/master.json. Make sure this page is served from the folder containing that file (not opened via double-click / file://).</div>';
  });

function keyOf(row) { return row.chapter; }

function matchesSearch(row, q) {
  if (!q) return true;
  const hay = [row.chapter, row.official_name, row.alias, row.city, row.state, row.federal_id]
    .join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function matchesVersion(row, v) {
  if (v === 'white') return !!row.logo_white;
  if (v === 'transparent') return !!row.logo_transparent;
  return true;
}

function visibleRows() {
  const q = searchInput.value.trim();
  const v = versionFilter.value;
  return DATA.filter(r => (r.logo_white || r.logo_transparent) && matchesSearch(r, q) && matchesVersion(r, v));
}

function render() {
  const rows = visibleRows();
  grid.innerHTML = '';
  emptyState.style.display = rows.length ? 'none' : 'block';

  rows.forEach(row => {
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(keyOf(row)) ? ' selected' : '');

    const thumbSrc = row.logo_white ? `logos/white/${encodeURIComponent(row.logo_white)}` :
                     row.logo_transparent ? `logos/transparent/${encodeURIComponent(row.logo_transparent)}` : '';

    card.innerHTML = `
      <label><input type="checkbox" data-key="${encodeURIComponent(keyOf(row))}" ${selected.has(keyOf(row)) ? 'checked' : ''}></label>
      <div class="thumb ${thumbSrc ? '' : 'missing'}">
        ${thumbSrc ? `<img src="${thumbSrc}" loading="lazy" alt="${row.official_name} logo">` : 'No logo file'}
      </div>
      <div class="chapter">${row.chapter}</div>
      <div class="school">${row.official_name}</div>
      <div class="meta">${row.city ? row.city + ', ' + row.state : 'No address on file'}${row.federal_id ? ' &middot; ID ' + row.federal_id : ''}</div>
    `;

    card.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
      const k = decodeURIComponent(e.target.dataset.key);
      if (e.target.checked) selected.add(k); else selected.delete(k);
      card.classList.toggle('selected', e.target.checked);
      updateCount();
    });

    grid.appendChild(card);
  });

  updateCount();
}

function updateCount() {
  const rows = visibleRows();
  countPill.textContent = `${rows.length} shown · ${selected.size} selected`;
  downloadBtn.disabled = selected.size === 0;
}

searchInput.addEventListener('input', render);
versionFilter.addEventListener('change', render);

document.getElementById('selectAllBtn').addEventListener('click', () => {
  visibleRows().forEach(r => selected.add(keyOf(r)));
  render();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  selected.clear();
  render();
});

// ---- Download dialog ----
const dialog = document.getElementById('downloadDialog');
const namingSelect = document.getElementById('namingSelect');
const logoVersionSelect = document.getElementById('logoVersionSelect');
const namePreview = document.getElementById('namePreview');
const dialogTitle = document.getElementById('dialogTitle');

function sanitize(name) {
  return name.replace(/[\/\\?%*:|"<>]/g, '-').trim();
}

function buildFilename(row, convention, ext) {
  let base;
  switch (convention) {
    case 'chapter': base = row.chapter; break;
    case 'school': base = row.official_name; break;
    case 'alias': base = row.alias || row.official_name; break;
    case 'chapter_school': base = `${row.chapter} - ${row.official_name}`; break;
    case 'federal_id': base = row.federal_id || row.chapter; break;
    case 'original':
    default:
      base = null;
  }
  if (base === null) return null; // signal: use original filename
  return sanitize(base) + ext;
}

function currentSelectionRows() {
  return DATA.filter(r => selected.has(keyOf(r)));
}

function updatePreview() {
  const rows = currentSelectionRows();
  if (!rows.length) { namePreview.textContent = ''; return; }
  const ver = logoVersionSelect.value;
  const sample = rows.find(r => ver === 'white' ? r.logo_white : r.logo_transparent) || rows[0];
  const origFile = ver === 'white' ? sample.logo_white : sample.logo_transparent;
  if (!origFile) {
    namePreview.textContent = `Note: not every selected school has a ${ver === 'white' ? 'White Background' : 'Transparent'} logo — those will be skipped.`;
    return;
  }
  const ext = origFile.slice(origFile.lastIndexOf('.'));
  const name = buildFilename(sample, namingSelect.value, ext) || origFile;
  namePreview.textContent = rows.length === 1
    ? `Will download as: ${name}`
    : `Example (1 of ${rows.length}): ${name}`;
}

namingSelect.addEventListener('change', updatePreview);
logoVersionSelect.addEventListener('change', updatePreview);

downloadBtn.addEventListener('click', () => {
  const rows = currentSelectionRows();
  dialogTitle.textContent = rows.length === 1 ? 'Download logo' : `Download ${rows.length} logos`;
  updatePreview();
  dialog.showModal();
});

document.getElementById('cancelDownloadBtn').addEventListener('click', () => dialog.close());

document.getElementById('confirmDownloadBtn').addEventListener('click', async () => {
  const rows = currentSelectionRows();
  const ver = logoVersionSelect.value;
  const convention = namingSelect.value;

  const withLogo = rows.filter(r => ver === 'white' ? r.logo_white : r.logo_transparent);
  if (!withLogo.length) {
    alert(`None of the selected schools have a ${ver === 'white' ? 'White Background' : 'Transparent'} logo available.`);
    return;
  }

  dialog.close();

  if (withLogo.length === 1) {
    const row = withLogo[0];
    const origFile = ver === 'white' ? row.logo_white : row.logo_transparent;
    const ext = origFile.slice(origFile.lastIndexOf('.'));
    const filename = buildFilename(row, convention, ext) || origFile;
    const url = `logos/${ver}/${encodeURIComponent(origFile)}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }

  // Multiple files -> zip
  const zip = new JSZip();
  const usedNames = new Set();
  await Promise.all(withLogo.map(async (row) => {
    const origFile = ver === 'white' ? row.logo_white : row.logo_transparent;
    const ext = origFile.slice(origFile.lastIndexOf('.'));
    let filename = buildFilename(row, convention, ext) || origFile;
    let finalName = filename;
    let n = 2;
    while (usedNames.has(finalName)) {
      finalName = filename.replace(ext, `-${n}${ext}`);
      n++;
    }
    usedNames.add(finalName);
    const resp = await fetch(`logos/${ver}/${encodeURIComponent(origFile)}`);
    const blob = await resp.blob();
    zip.file(finalName, blob);
  }));

  const content = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sigep-school-logos-${ver}.zip`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>

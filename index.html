<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Logo Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
  :root {
    --accent: #2b5b8c;
    --accent-dark: #1e4266;
    --gray-bg: #f5f5f7;
    --border: #d9d9e0;
    --text: #232228;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: var(--gray-bg);
    color: var(--text);
  }
  header {
    background: var(--accent);
    color: white;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; opacity: 0.85; font-size: 14px; }
  header .header-actions { display: flex; gap: 10px; }
  header .header-actions button {
    background: rgba(255,255,255,0.12);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  header .header-actions button:hover { background: rgba(255,255,255,0.22); }

  .toolbar {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .toolbar input[type="text"] {
    flex: 1 1 260px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .toolbar button, .toolbar select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: white;
  }
  .toolbar button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    cursor: pointer;
    font-weight: 600;
  }
  .toolbar button.primary:disabled {
    background: #a9bccf;
    border-color: #a9bccf;
    cursor: not-allowed;
  }

  /* View toggle (list / map icons) */
  .view-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .view-toggle button {
    border: none;
    border-radius: 0;
    background: white;
    padding: 8px 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    color: #666;
  }
  .view-toggle button + button { border-left: 1px solid var(--border); }
  .view-toggle button svg { width: 18px; height: 18px; }
  .view-toggle button.active { background: var(--accent); color: white; }

  /* Filter (funnel) button + popover */
  .filter-wrap { position: relative; }
  #filterBtn { display: flex; align-items: center; gap: 6px; cursor: pointer; position: relative; }
  #filterBtn svg { width: 16px; height: 16px; }
  #filterBtn .active-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); display: none;
  }
  #filterBtn.has-active .active-dot { display: inline-block; }
  #filterPanel {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    padding: 16px;
    width: 280px;
    z-index: 20;
  }
  #filterPanel.open { display: block; }
  #filterPanel label { display: block; font-size: 12px; font-weight: 600; color: #555; margin: 12px 0 5px; }
  #filterPanel label:first-child { margin-top: 0; }
  #filterPanel select { width: 100%; }
  #filterPanel .panel-footer { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
  #filterPanel .clear-filters-link { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; padding: 0; }

  .select-all-wrap { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #333; white-space: nowrap; }
  .select-all-wrap input[type="checkbox"] { width: 16px; height: 16px; }

  .count-pill { font-size: 13px; color: #555; white-space: nowrap; }

  main { padding: 20px 28px 60px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(43,91,140,0.2); }
  .card .thumb {
    height: 110px;
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; border: 1px solid #ececef; border-radius: 6px; overflow: hidden;
  }
  .card .thumb img { max-width: 100%; max-height: 100%; }
  .card .thumb.missing { color: #999; font-size: 12px; text-align: center; padding: 8px; }
  .card .school { font-weight: 700; font-size: 13px; line-height: 1.3; color: var(--accent-dark); }
  .card .alias { font-size: 12px; color: #555; }
  .card .meta { font-size: 11px; color: #777; line-height: 1.4; }
  .card label.select-box { position: absolute; top: 10px; right: 10px; }
  .card input[type="checkbox"] { width: 18px; height: 18px; }
  .card .report-link { font-size: 11px; color: var(--accent); text-decoration: none; align-self: flex-start; }
  .card .report-link:hover { text-decoration: underline; }

  .empty-state { text-align: center; color: #777; padding: 60px 20px; }

  /* Map view */
  #mapContainer {
    display: none;
    height: 72vh;
    min-height: 420px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: white;
  }
  #mapView { width: 100%; height: 100%; }
  .map-popup { min-width: 190px; }
  .map-popup .thumb {
    height: 90px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 1px solid #ececef; border-radius: 6px; overflow: hidden; margin-bottom: 8px;
  }
  .map-popup .thumb img { max-width: 100%; max-height: 100%; }
  .map-popup .school { font-weight: 700; font-size: 13px; color: var(--accent-dark); margin-bottom: 2px; }
  .map-popup .alias { font-size: 12px; color: #555; margin-bottom: 4px; }
  .map-popup .meta { font-size: 11px; color: #777; margin-bottom: 8px; line-height: 1.4; }
  .map-popup label { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 6px; cursor: pointer; }
  .map-popup .report-link { font-size: 11px; color: var(--accent); text-decoration: none; }
  .map-popup .report-link:hover { text-decoration: underline; }
  .marker-pin {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0;
    background: var(--accent); border: 2px solid white;
    transform: rotate(-45deg);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .marker-pin.is-selected { background: #d3902b; }
  .marker-cluster-university { background: rgba(43,91,140,0.35); }
  .marker-cluster-university div { background: rgba(43,91,140,0.75); color: white; }

  dialog { border: none; border-radius: 12px; padding: 0; max-width: 440px; width: 90%; }
  dialog::backdrop { background: rgba(0,0,0,0.4); }
  .dialog-inner { padding: 22px 24px; max-height: 80vh; overflow-y: auto; }
  .dialog-inner h2 { margin-top: 0; font-size: 17px; }
  .dialog-inner label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .dialog-inner select, .dialog-inner input[type="text"] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  }
  .dialog-inner .hint { font-size: 11px; color: #888; margin-top: 4px; }
  .dialog-inner .preview {
    margin-top: 8px; font-size: 12px; color: #666; background: #f5f5f7;
    padding: 8px 10px; border-radius: 6px; word-break: break-all;
  }
  #customNamingFields { border-left: 3px solid var(--border); padding-left: 12px; margin-top: 10px; }
  .dialog-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
  .dialog-actions button { padding: 9px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: white; }
  .dialog-actions button.primary { background: var(--accent); color: white; border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <h1>University Logo Finder</h1>
    <p>Search official U.S. university and college logos. Select one or more, then download.</p>
  </div>
  <div class="header-actions">
    <button id="requestSchoolBtn">Request a school be added</button>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search school name, nickname, city, state, conference, or federal ID...">

  <div class="filter-wrap">
    <button id="filterBtn" type="button" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      Filters
      <span class="active-dot"></span>
    </button>
    <div id="filterPanel">
      <label for="versionFilter">Logo version</label>
      <select id="versionFilter">
        <option value="any">Any logo version</option>
        <option value="white">White Background</option>
        <option value="transparent">Transparent Background</option>
      </select>

      <label for="stateFilter">State</label>
      <select id="stateFilter"><option value="">Any state</option></select>

      <label for="conferenceFilter">Football conference</label>
      <select id="conferenceFilter"><option value="">Any football conference</option></select>

      <div class="panel-footer">
        <button type="button" class="clear-filters-link" id="clearFiltersBtn">Clear all filters</button>
      </div>
    </div>
  </div>

  <div class="view-toggle">
    <button id="listViewBtn" class="active" type="button" title="List view" aria-label="List view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7"></rect><rect x="14" y="4" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
    </button>
    <button id="mapViewBtn" type="button" title="Map view" aria-label="Map view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
    </button>
  </div>

  <div class="select-all-wrap">
    <input type="checkbox" id="selectAllCheckbox">
    <label for="selectAllCheckbox">Select all</label>
  </div>

  <span class="count-pill" id="countPill">0 shown &middot; 0 selected</span>
  <button class="primary" id="downloadBtn" disabled>Download selected</button>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div id="mapContainer"><div id="mapView"></div></div>
  <div class="empty-state" id="emptyState" style="display:none;">No schools match your search.</div>
</main>

<dialog id="downloadDialog">
  <div class="dialog-inner">
    <h2 id="dialogTitle">Download logo</h2>

    <label for="logoVersionSelect">Logo version</label>
    <select id="logoVersionSelect">
      <option value="white">White Background</option>
      <option value="transparent">Transparent Background</option>
    </select>

    <label for="namingSelect">File naming convention</label>
    <select id="namingSelect">
      <option value="school">Official school name (e.g. "The Ohio State University.png")</option>
      <option value="alias">Short name (e.g. "Ohio State.png")</option>
      <option value="federal_id">Federal school code</option>
      <option value="school_federal">School name + Federal ID</option>
      <option value="original">Keep original filename</option>
      <option value="custom">Custom (add your own text, mix and match)</option>
    </select>

    <div id="customNamingFields" style="display:none;">
      <label for="customBaseSelect">Base the filename on</label>
      <select id="customBaseSelect">
        <option value="school">Official school name</option>
        <option value="alias">Short name</option>
        <option value="federal_id">Federal school code</option>
        <option value="school_federal">School name + Federal ID</option>
      </select>

      <label for="prefixInput">Text to add before (optional)</label>
      <input type="text" id="prefixInput" placeholder='e.g. "Logo - "'>

      <label for="suffixInput">Text to add after (optional)</label>
      <input type="text" id="suffixInput" placeholder='e.g. " - Final"'>
      <div class="hint">Both fields are inserted exactly as typed, right before the file extension.</div>
    </div>

    <div class="preview" id="namePreview"></div>

    <div class="dialog-actions">
      <button id="cancelDownloadBtn">Cancel</button>
      <button class="primary" id="confirmDownloadBtn">Download</button>
    </div>
  </div>
</dialog>

<script>
// ---- Configuration ----
const REPORT_EMAIL = "zacgillman@gmail.com";

const STATE_NAMES = {
  AL:"Alabama", AK:"Alaska", AZ:"Arizona", AR:"Arkansas", CA:"California", CO:"Colorado",
  CT:"Connecticut", DE:"Delaware", DC:"District of Columbia", FL:"Florida", GA:"Georgia",
  HI:"Hawaii", ID:"Idaho", IL:"Illinois", IN:"Indiana", IA:"Iowa", KS:"Kansas", KY:"Kentucky",
  LA:"Louisiana", ME:"Maine", MD:"Maryland", MA:"Massachusetts", MI:"Michigan", MN:"Minnesota",
  MS:"Mississippi", MO:"Missouri", MT:"Montana", NE:"Nebraska", NV:"Nevada", NH:"New Hampshire",
  NJ:"New Jersey", NM:"New Mexico", NY:"New York", NC:"North Carolina", ND:"North Dakota",
  OH:"Ohio", OK:"Oklahoma", OR:"Oregon", PA:"Pennsylvania", RI:"Rhode Island",
  SC:"South Carolina", SD:"South Dakota", TN:"Tennessee", TX:"Texas", UT:"Utah", VT:"Vermont",
  VA:"Virginia", WA:"Washington", WV:"West Virginia", WI:"Wisconsin", WY:"Wyoming"
};

let DATA = [];
let selected = new Set(); // set of internal ids
let currentView = 'list'; // 'list' | 'map'
let map = null;
let markerCluster = null;
let markerById = new Map();

const grid = document.getElementById('grid');
const mapContainer = document.getElementById('mapContainer');
const searchInput = document.getElementById('searchInput');
const versionFilter = document.getElementById('versionFilter');
const conferenceFilter = document.getElementById('conferenceFilter');
const stateFilter = document.getElementById('stateFilter');
const countPill = document.getElementById('countPill');
const downloadBtn = document.getElementById('downloadBtn');
const emptyState = document.getElementById('emptyState');
const selectAllCheckbox = document.getElementById('selectAllCheckbox');
const filterBtn = document.getElementById('filterBtn');
const filterPanel = document.getElementById('filterPanel');
const listViewBtn = document.getElementById('listViewBtn');
const mapViewBtn = document.getElementById('mapViewBtn');

fetch('data/master.json?v=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    DATA = data;

    const conferences = Array.from(new Set(
      DATA.map(r => r.conference).filter(c => c && c !== 'No football program')
    )).sort();
    conferences.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      conferenceFilter.appendChild(opt);
    });

    const states = Array.from(new Set(DATA.map(r => (r.state || '').toUpperCase()).filter(Boolean))).sort();
    states.forEach(abbr => {
      const opt = document.createElement('option');
      opt.value = abbr;
      opt.textContent = STATE_NAMES[abbr] ? `${STATE_NAMES[abbr]} (${abbr})` : abbr;
      stateFilter.appendChild(opt);
    });

    render();
  })
  .catch(err => {
    console.error(err);
    grid.innerHTML = '<div class="empty-state">Could not load data/master.json. Make sure this page is served from the folder containing that file (not opened via double-click / file://).</div>';
  });

function keyOf(row) { return row.id || row.official_name; }

function matchesSearch(row, q) {
  if (!q) return true;
  const stateAbbrev = (row.state || '').toUpperCase();
  const stateFullName = STATE_NAMES[stateAbbrev] || '';
  const nicknames = (row.nicknames || []).join(' ');
  const hay = [row.official_name, row.alias, nicknames, row.city, row.state, stateFullName, row.federal_id, row.conference]
    .join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function matchesVersion(row, v) {
  if (v === 'white') return !!row.logo_white;
  if (v === 'transparent') return !!row.logo_transparent;
  return true;
}
function matchesConference(row, c) { return !c || row.conference === c; }
function matchesState(row, s) { return !s || (row.state || '').toUpperCase() === s; }

function visibleRows() {
  const q = searchInput.value.trim();
  const v = versionFilter.value;
  const c = conferenceFilter.value;
  const s = stateFilter.value;
  return DATA.filter(r => (r.logo_white || r.logo_transparent)
    && matchesSearch(r, q) && matchesVersion(r, v) && matchesConference(r, c) && matchesState(r, s));
}

function mailtoReportUrl(row) {
  const subject = `University Logo Finder - Error report: ${row.official_name}`;
  const body = [
    `School: ${row.official_name}`,
    `Alias shown on site: ${row.alias || '(none)'}`,
    `Address on file: ${row.street ? row.street + ', ' : ''}${row.city || ''}${row.city && row.state ? ', ' : ''}${row.state || ''} ${row.zip || ''}`.trim(),
    `Federal school code on file: ${row.federal_id || '(none)'}`,
    `Conference on file: ${row.conference || '(none)'}`,
    '', 'Please describe the issue or the correction needed:', ''
  ].join('\n');
  return `mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function mailtoRequestSchoolUrl() {
  const subject = `University Logo Finder - New school request`;
  const body = ['School name:', 'City / State:', 'Link to an official logo (or attach one to this email):', 'Any other notes:', ''].join('\n');
  return `mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

document.getElementById('requestSchoolBtn').addEventListener('click', () => {
  window.location.href = mailtoRequestSchoolUrl();
});

// ---- Filter popover ----
function refreshFilterActiveDot() {
  const active = versionFilter.value !== 'any' || !!conferenceFilter.value || !!stateFilter.value;
  filterBtn.classList.toggle('has-active', active);
}
filterBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = filterPanel.classList.toggle('open');
  filterBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
});
document.addEventListener('click', (e) => {
  if (!filterPanel.contains(e.target) && e.target !== filterBtn) {
    filterPanel.classList.remove('open');
    filterBtn.setAttribute('aria-expanded', 'false');
  }
});
document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  versionFilter.value = 'any'; conferenceFilter.value = ''; stateFilter.value = '';
  refreshFilterActiveDot(); render();
});

// ---- View toggle ----
function setView(view) {
  currentView = view;
  listViewBtn.classList.toggle('active', view === 'list');
  mapViewBtn.classList.toggle('active', view === 'map');
  grid.style.display = view === 'list' ? 'grid' : 'none';
  mapContainer.style.display = view === 'map' ? 'block' : 'none';
  if (view === 'map') {
    ensureMapInitialized();
    render();
    setTimeout(() => map && map.invalidateSize(), 50);
  } else {
    render();
  }
}
listViewBtn.addEventListener('click', () => setView('list'));
mapViewBtn.addEventListener('click', () => setView('map'));

function ensureMapInitialized() {
  if (map) return;
  map = L.map('mapView').setView([39.5, -98.35], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);
  markerCluster = L.markerClusterGroup({ iconCreateFunction: clusterIcon });
  map.addLayer(markerCluster);
}

function clusterIcon(cluster) {
  const count = cluster.getChildCount();
  return L.divIcon({
    html: `<div style="background:rgba(43,91,140,0.85);color:white;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;border:2px solid white;">${count}</div>`,
    className: 'marker-cluster-university',
    iconSize: L.point(40, 40)
  });
}

function pinIcon(isSelected) {
  return L.divIcon({
    className: '',
    html: `<div class="marker-pin${isSelected ? ' is-selected' : ''}"></div>`,
    iconSize: [26, 26],
    iconAnchor: [13, 26],
    popupAnchor: [0, -26]
  });
}

function popupHtml(row) {
  const thumbSrc = row.logo_transparent ? `logos/transparent/${encodeURIComponent(row.logo_transparent)}` :
                   row.logo_white ? `logos/white/${encodeURIComponent(row.logo_white)}` : '';
  const k = keyOf(row);
  return `
    <div class="map-popup">
      <div class="thumb">${thumbSrc ? `<img src="${thumbSrc}" alt="${row.official_name} logo">` : 'No logo file'}</div>
      <div class="school">${row.official_name}</div>
      ${row.alias ? `<div class="alias">${row.alias}</div>` : ''}
      <div class="meta">${row.city ? row.city + ', ' + row.state : ''}${row.federal_id ? ' &middot; ID ' + row.federal_id : ''}${row.conference && row.conference !== 'No football program' ? '<br>' + row.conference : ''}</div>
      <label><input type="checkbox" class="map-select-cb" data-key="${encodeURIComponent(k)}" ${selected.has(k) ? 'checked' : ''}> Select this school</label>
      <a class="report-link" href="${mailtoReportUrl(row)}">Report an error / request an edit</a>
    </div>
  `;
}

function renderMap() {
  if (!map || !markerCluster) return;
  markerCluster.clearLayers();
  markerById.clear();
  const rows = visibleRows().filter(r => typeof r.lat === 'number' && typeof r.lng === 'number');
  rows.forEach(row => {
    const k = keyOf(row);
    const marker = L.marker([row.lat, row.lng], { icon: pinIcon(selected.has(k)) });
    marker.bindPopup(popupHtml(row));
    marker.on('popupopen', (e) => {
      const cb = e.popup.getElement().querySelector('.map-select-cb');
      if (cb) {
        cb.addEventListener('change', () => {
          if (cb.checked) selected.add(k); else selected.delete(k);
          marker.setIcon(pinIcon(cb.checked));
          updateCount();
        });
      }
    });
    markerCluster.addLayer(marker);
    markerById.set(k, marker);
  });
}

function render() {
  if (currentView === 'map') {
    renderMap();
    const rows = visibleRows();
    emptyState.style.display = rows.length ? 'none' : 'block';
    updateCount();
    return;
  }

  const rows = visibleRows();
  grid.innerHTML = '';
  emptyState.style.display = rows.length ? 'none' : 'block';

  rows.forEach(row => {
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(keyOf(row)) ? ' selected' : '');
    const thumbSrc = row.logo_transparent ? `logos/transparent/${encodeURIComponent(row.logo_transparent)}` :
                     row.logo_white ? `logos/white/${encodeURIComponent(row.logo_white)}` : '';
    card.innerHTML = `
      <label class="select-box"><input type="checkbox" data-key="${encodeURIComponent(keyOf(row))}" ${selected.has(keyOf(row)) ? 'checked' : ''}></label>
      <div class="thumb ${thumbSrc ? '' : 'missing'}">
        ${thumbSrc ? `<img src="${thumbSrc}" loading="lazy" alt="${row.official_name} logo">` : 'No logo file'}
      </div>
      <div class="school">${row.official_name}</div>
      ${row.alias ? `<div class="alias">${row.alias}</div>` : ''}
      <div class="meta">${row.city ? row.city + ', ' + row.state : 'No address on file'}${row.federal_id ? ' &middot; ID ' + row.federal_id : ''}${row.conference && row.conference !== 'No football program' ? ' &middot; ' + row.conference : ''}</div>
      <a class="report-link" href="${mailtoReportUrl(row)}">Report an error / request an edit</a>
    `;
    card.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
      const k = decodeURIComponent(e.target.dataset.key);
      if (e.target.checked) selected.add(k); else selected.delete(k);
      card.classList.toggle('selected', e.target.checked);
      updateCount();
    });
    grid.appendChild(card);
  });

  updateCount();
}

function updateCount() {
  const rows = visibleRows();
  const selectedInView = rows.filter(r => selected.has(keyOf(r))).length;
  countPill.textContent = `${rows.length} shown · ${selected.size} selected`;
  downloadBtn.disabled = selected.size === 0;

  if (rows.length === 0) {
    selectAllCheckbox.checked = false;
    selectAllCheckbox.indeterminate = false;
    selectAllCheckbox.disabled = true;
  } else {
    selectAllCheckbox.disabled = false;
    selectAllCheckbox.checked = selectedInView === rows.length;
    selectAllCheckbox.indeterminate = selectedInView > 0 && selectedInView < rows.length;
  }

  // Keep map pin colors in sync if the map is the active view.
  if (currentView === 'map') {
    markerById.forEach((marker, k) => marker.setIcon(pinIcon(selected.has(k))));
  }
}

searchInput.addEventListener('input', render);
versionFilter.addEventListener('change', () => { refreshFilterActiveDot(); render(); });
conferenceFilter.addEventListener('change', () => { refreshFilterActiveDot(); render(); });
stateFilter.addEventListener('change', () => { refreshFilterActiveDot(); render(); });

selectAllCheckbox.addEventListener('click', () => {
  const rows = visibleRows();
  const selectedInView = rows.filter(r => selected.has(keyOf(r))).length;
  if (selectedInView === rows.length) {
    rows.forEach(r => selected.delete(keyOf(r)));
  } else {
    rows.forEach(r => selected.add(keyOf(r)));
  }
  render();
});

// ---- Download dialog ----
const dialog = document.getElementById('downloadDialog');
const namingSelect = document.getElementById('namingSelect');
const logoVersionSelect = document.getElementById('logoVersionSelect');
const namePreview = document.getElementById('namePreview');
const dialogTitle = document.getElementById('dialogTitle');
const customNamingFields = document.getElementById('customNamingFields');
const customBaseSelect = document.getElementById('customBaseSelect');
const prefixInput = document.getElementById('prefixInput');
const suffixInput = document.getElementById('suffixInput');

function sanitize(name) { return name.replace(/[\/\\?%*:|"<>]/g, '-').trim(); }

function baseValue(row, baseKind) {
  switch (baseKind) {
    case 'alias': return row.alias || row.official_name;
    case 'federal_id': return row.federal_id || row.official_name;
    case 'school_federal': return `${row.official_name}${row.federal_id ? ' - ' + row.federal_id : ''}`;
    case 'school': default: return row.official_name;
  }
}
function buildFilename(row, convention, ext) {
  if (convention === 'original') return null;
  if (convention === 'custom') {
    const base = baseValue(row, customBaseSelect.value);
    const named = `${prefixInput.value || ''}${base}${suffixInput.value || ''}`;
    return sanitize(named) + ext;
  }
  return sanitize(baseValue(row, convention)) + ext;
}
function currentSelectionRows() { return DATA.filter(r => selected.has(keyOf(r))); }
function updateCustomFieldsVisibility() { customNamingFields.style.display = namingSelect.value === 'custom' ? 'block' : 'none'; }

function updatePreview() {
  const rows = currentSelectionRows();
  if (!rows.length) { namePreview.textContent = ''; return; }
  const ver = logoVersionSelect.value;
  const sample = rows.find(r => ver === 'white' ? r.logo_white : r.logo_transparent) || rows[0];
  const origFile = ver === 'white' ? sample.logo_white : sample.logo_transparent;
  if (!origFile) {
    namePreview.textContent = `Note: not every selected school has a ${ver === 'white' ? 'White Background' : 'Transparent Background'} logo — those will be skipped.`;
    return;
  }
  const ext = origFile.slice(origFile.lastIndexOf('.'));
  const name = buildFilename(sample, namingSelect.value, ext) || origFile;
  namePreview.textContent = rows.length === 1 ? `Will download as: ${name}` : `Example (1 of ${rows.length}): ${name}`;
}

namingSelect.addEventListener('change', () => { updateCustomFieldsVisibility(); updatePreview(); });
logoVersionSelect.addEventListener('change', updatePreview);
customBaseSelect.addEventListener('change', updatePreview);
prefixInput.addEventListener('input', updatePreview);
suffixInput.addEventListener('input', updatePreview);

downloadBtn.addEventListener('click', () => {
  const rows = currentSelectionRows();
  dialogTitle.textContent = rows.length === 1 ? 'Download logo' : `Download ${rows.length} logos`;
  updateCustomFieldsVisibility();
  updatePreview();
  dialog.showModal();
});
document.getElementById('cancelDownloadBtn').addEventListener('click', () => dialog.close());

document.getElementById('confirmDownloadBtn').addEventListener('click', async () => {
  const rows = currentSelectionRows();
  const ver = logoVersionSelect.value;
  const convention = namingSelect.value;

  const withLogo = rows.filter(r => ver === 'white' ? r.logo_white : r.logo_transparent);
  if (!withLogo.length) {
    alert(`None of the selected schools have a ${ver === 'white' ? 'White Background' : 'Transparent Background'} logo available.`);
    return;
  }
  dialog.close();

  if (withLogo.length === 1) {
    const row = withLogo[0];
    const origFile = ver === 'white' ? row.logo_white : row.logo_transparent;
    const ext = origFile.slice(origFile.lastIndexOf('.'));
    const filename = buildFilename(row, convention, ext) || origFile;
    const url = `logos/${ver}/${encodeURIComponent(origFile)}`;
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }

  const zip = new JSZip();
  const usedNames = new Set();
  await Promise.all(withLogo.map(async (row) => {
    const origFile = ver === 'white' ? row.logo_white : row.logo_transparent;
    const ext = origFile.slice(origFile.lastIndexOf('.'));
    let filename = buildFilename(row, convention, ext) || origFile;
    let finalName = filename;
    let n = 2;
    while (usedNames.has(finalName)) { finalName = filename.replace(ext, `-${n}${ext}`); n++; }
    usedNames.add(finalName);
    const resp = await fetch(`logos/${ver}/${encodeURIComponent(origFile)}`);
    const blob = await resp.blob();
    zip.file(finalName, blob);
  }));

  const content = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url; a.download = `university-logos-${ver}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});
</script>
